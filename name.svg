<svg fill="none" viewBox="0 0 800 110" width="800" height="110" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				@keyframes gradientText {
				  0%   { background-position: 0% 50%; }
				  50%  { background-position: 100% 50%; }
				  100% { background-position: 0% 50%; }
				}
				@keyframes glowPulse {
				  0%   { filter: drop-shadow(0 0 8px #7aa2f780) drop-shadow(0 0 24px #bb9af740); }
				  50%  { filter: drop-shadow(0 0 18px #7aa2f7cc) drop-shadow(0 0 40px #bb9af770); }
				  100% { filter: drop-shadow(0 0 8px #7aa2f780) drop-shadow(0 0 24px #bb9af740); }
				}
				body {
				  margin: 0;
				  padding: 0;
				  background: transparent;
				}
				h1 {
				  font-family: 'Inter',
				    -apple-system,
				    BlinkMacSystemFont,
				    'Segoe UI',
				    'Roboto',
				    'Oxygen',
				    'Ubuntu',
				    'Cantarell',
				    'Fira Sans',
				    'Droid Sans',
				    'Helvetica Neue',
				    sans-serif;
				  margin: 0;
				  padding: 12px 0;
				  font-size: 4em;
				  font-weight: 900;
				  letter-spacing: -.04em;
				  text-align: center;
				  background: linear-gradient(270deg, #7aa2f7 0%, #bb9af7 40%, #2ac3de 70%, #7aa2f7 100%);
				  background-size: 300%;
				  background-clip: text;
				  -webkit-background-clip: text;
				  -webkit-text-fill-color: transparent;
				  animation: gradientText 4s ease infinite, glowPulse 3s ease-in-out infinite;
				}
			</style>
			<h1>SANJAY S</h1>
		</div>
	</foreignObject>
</svg>
